<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IER - Urinário</title>
<meta name="description" content="Jogo de fixação IER - Urinário">
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef3f6;color:#17313b}
header{background:#0f4c5c;color:white;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header-inner{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:30px;letter-spacing:.5px}
.back{color:white;text-decoration:none;font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:18px}
.subtitle{color:#56717a;margin:4px 0 18px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(15,76,92,.12)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#526b73}
.progress{height:11px;background:#dfe8eb;border-radius:999px;overflow:hidden;margin:18px 0 22px}
.bar{height:100%;background:#0f4c5c;width:0%;transition:width .25s}
h2{font-size:22px;line-height:1.35;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;margin:10px 0;border:1px solid #cfdde2;border-radius:12px;background:white;color:#17313b;font-size:16px;cursor:pointer;transition:.15s}
.opt:hover{background:#f3f8fa;border-color:#8fb7c1}
.opt:disabled{cursor:default}
.correct{background:#e2f6e9!important;border-color:#2f9e5b!important}
.wrong{background:#fde8e8!important;border-color:#d94b4b!important}
.feedback{margin-top:16px;padding:15px;border-radius:12px;background:#f4f8fa;display:none;line-height:1.45}
.next{margin-top:16px;padding:12px 18px;border:0;border-radius:12px;background:#0f4c5c;color:white;font-size:16px;font-weight:700;cursor:pointer;display:none}
.result{text-align:center;padding:12px}
.big{font-size:48px;font-weight:800;color:#0f4c5c}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.action{padding:12px 16px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:700}
.primary{background:#0f4c5c;color:white}
.secondary{background:#e7eff2;color:#17313b}
footer{text-align:center;color:#78909a;font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">IER</div>
    <a class="back" href="index.html">← Voltar aos jogos</a>
  </div>
</header>
<div class="wrap">
  <div class="subtitle">Jogo de Fixação • Urinário • 25 questões</div>
  <div class="card" id="game">
    <div class="meta"><span id="count"></span><span id="score">Acertos: 0</span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Próxima questão</button>
  </div>
</div>
<footer>IER • Aprender praticando</footer>
<script>
const questions = [{"q": "A principal função do sistema urinário é:", "options": ["Filtrar impurezas do sangue e eliminá-las", "Realizar hematose", "Produzir suor", "Bombear sangue"], "answer": 0, "explanation": "A apostila destaca filtração do sangue, eliminação e preservação do necessário."}, {"q": "Qual órgão realiza a filtração do sangue no sistema urinário?", "options": ["Rim", "Pulmão", "Baço", "Coração"], "answer": 0, "explanation": "Os rins são os principais órgãos de filtração urinária."}, {"q": "A urina produzida nos rins segue para:", "options": ["Ureteres", "Brônquios", "Artérias pulmonares", "Ductos biliares"], "answer": 0, "explanation": "Os ureteres conduzem a urina em direção à bexiga."}, {"q": "Os ureteres conduzem urina dos:", "options": ["Rins para a bexiga", "Pulmões para o coração", "Átrios para os ventrículos", "Intestinos para o fígado"], "answer": 0, "explanation": "Essa é a função de condução dos ureteres."}, {"q": "A bexiga urinária tem como função principal:", "options": ["Armazenar urina", "Produzir bile", "Produzir linfa", "Realizar hematose"], "answer": 0, "explanation": "A bexiga armazena a urina antes da eliminação."}, {"q": "A uretra tem como função:", "options": ["Eliminar a urina do corpo", "Levar ar aos pulmões", "Transportar bile", "Conduzir linfa"], "answer": 0, "explanation": "A apostila descreve a uretra como via de eliminação da urina."}, {"q": "No homem, a uretra também serve como:", "options": ["Via de saída espermática", "Via biliar", "Via linfática", "Via respiratória"], "answer": 0, "explanation": "O material cita função urinária e espermática no homem."}, {"q": "O comprimento da uretra masculina citado na apostila é aproximadamente:", "options": ["1 a 2 cm", "5 a 10 cm", "15 a 20 cm", "40 a 50 cm"], "answer": 2, "explanation": "A apostila cita cerca de 15 a 20 cm."}, {"q": "O comprimento da uretra feminina citado é aproximadamente:", "options": ["5 a 10 cm", "15 a 20 cm", "30 cm", "50 cm"], "answer": 0, "explanation": "O material cita cerca de 5 a 10 cm."}, {"q": "A unidade funcional relacionada à filtração renal é o:", "options": ["Néfron", "Alvéolo", "Linfonodo", "Folículo piloso"], "answer": 0, "explanation": "O néfron é a unidade funcional renal abordada no conteúdo urinário."}, {"q": "O sistema urinário ajuda a preservar:", "options": ["Substâncias necessárias ao organismo", "Somente gás carbônico", "Somente suor", "Somente sebo"], "answer": 0, "explanation": "O material destaca eliminação de impurezas e preservação do que é necessário."}, {"q": "Qual sequência representa o trajeto da urina?", "options": ["Rim → ureter → bexiga → uretra", "Rim → traqueia → bexiga → uretra", "Bexiga → rim → ureter → coração", "Uretra → rim → pulmão → bexiga"], "answer": 0, "explanation": "Essa é a sequência anatômica do fluxo urinário."}, {"q": "Os rins localizam-se no sistema:", "options": ["Urinário", "Respiratório", "Tegumentar", "Linfático exclusivamente"], "answer": 0, "explanation": "Os rins são órgãos centrais do sistema urinário."}, {"q": "A bexiga recebe a urina através dos:", "options": ["Ureteres", "Brônquios", "Ductos deferentes", "Vasos coronários"], "answer": 0, "explanation": "Os ureteres desembocam na bexiga."}, {"q": "A saída final da urina ocorre pela:", "options": ["Uretra", "Aorta", "Traqueia", "Faringe"], "answer": 0, "explanation": "A uretra conduz a urina para fora do corpo."}, {"q": "A filtração renal ocorre a partir do:", "options": ["Sangue", "Ar inspirado", "Sebo", "Líquido pericárdico"], "answer": 0, "explanation": "O sistema urinário filtra impurezas presentes no sangue."}, {"q": "Qual estrutura NÃO pertence ao sistema urinário?", "options": ["Ureter", "Bexiga", "Uretra", "Brônquio"], "answer": 3, "explanation": "Brônquios pertencem ao sistema respiratório."}, {"q": "Qual estrutura é par no sistema urinário?", "options": ["Rins", "Bexiga", "Uretra", "Próstata"], "answer": 0, "explanation": "O corpo possui dois rins."}, {"q": "A urina fica temporariamente armazenada na:", "options": ["Bexiga", "Uretra", "Aorta", "Traqueia"], "answer": 0, "explanation": "A bexiga funciona como reservatório urinário."}, {"q": "A função de condução, e não de armazenamento, é realizada pelos:", "options": ["Ureteres", "Bexiga", "Rins apenas", "Glomérulos apenas"], "answer": 0, "explanation": "Os ureteres são tubos condutores."}, {"q": "A eliminação de impurezas filtradas ocorre principalmente por meio da:", "options": ["Urina", "Linfa", "Saliva", "Bile"], "answer": 0, "explanation": "As impurezas filtradas são eliminadas na urina."}, {"q": "O sistema urinário contribui diretamente para a manutenção do:", "options": ["Equilíbrio dos líquidos corporais", "Movimento dos pelos", "Olfato", "Som"], "answer": 0, "explanation": "A filtração e conservação de substâncias contribuem para o equilíbrio interno."}, {"q": "Qual associação está correta?", "options": ["Rim — filtração", "Bexiga — hematose", "Ureter — produção de bile", "Uretra — bombeamento sanguíneo"], "answer": 0, "explanation": "O rim é o órgão filtrador do sistema."}, {"q": "Qual associação está correta?", "options": ["Bexiga — armazenamento de urina", "Rim — armazenamento de ar", "Ureter — digestão", "Uretra — produção de linfa"], "answer": 0, "explanation": "A bexiga armazena a urina."}, {"q": "Qual associação está correta?", "options": ["Uretra — eliminação da urina", "Ureter — produção de suor", "Rim — olfação", "Bexiga — coagulação"], "answer": 0, "explanation": "A uretra é a via final de eliminação urinária."}];
let current=0, score=0;
function render(){
  const item=questions[current];
  document.getElementById('count').textContent=`Questão ${current+1} de ${questions.length}`;
  document.getElementById('score').textContent=`Acertos: ${score}`;
  document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options');
  box.innerHTML='';
  const fb=document.getElementById('feedback');
  fb.style.display='none';
  fb.textContent='';
  document.getElementById('next').style.display='none';
  item.options.forEach((txt,idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=String.fromCharCode(65+idx)+') '+txt;
    b.onclick=()=>answer(idx,b);
    box.appendChild(b);
  });
}
function answer(idx,btn){
  const item=questions[current];
  [...document.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(i===item.answer) b.classList.add('correct');
  });
  if(idx===item.answer) score++;
  else btn.classList.add('wrong');
  document.getElementById('score').textContent=`Acertos: ${score}`;
  const fb=document.getElementById('feedback');
  fb.textContent=(idx===item.answer?'Muito bem! ':'Revise este ponto. ')+item.explanation;
  fb.style.display='block';
  document.getElementById('next').style.display='inline-block';
}
document.getElementById('next').onclick=()=>{
  current++;
  if(current<questions.length) render();
  else finish();
};
function finish(){
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);
  let msg = pct>=80 ? 'Excelente desempenho!' : pct>=60 ? 'Bom trabalho! Continue praticando.' : 'Vale revisar o conteúdo e tentar novamente.';
  document.getElementById('game').innerHTML=`
    <div class="result">
      <div class="big">${score}/${questions.length}</div>
      <h2>Resultado final</h2>
      <p>Você acertou <strong>${pct}%</strong> das questões.</p>
      <p>${msg}</p>
      <div class="actions">
        <button class="action primary" onclick="location.reload()">Jogar novamente</button>
        <a class="action secondary" href="index.html">Outros jogos</a>
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
