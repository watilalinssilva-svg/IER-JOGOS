<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef3f6;color:#17313b}
header{background:#0f4c5c;color:white;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header-inner{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:30px;letter-spacing:.5px}.back{color:white;text-decoration:none;font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:18px}.subtitle{color:#56717a;margin:4px 0 18px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(15,76,92,.12)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#526b73}
.progress{height:11px;background:#dfe8eb;border-radius:999px;overflow:hidden;margin:18px 0 22px}
.bar{height:100%;background:#0f4c5c;width:0%;transition:width .25s}h2{font-size:22px;line-height:1.35;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;margin:10px 0;border:1px solid #cfdde2;border-radius:12px;background:white;color:#17313b;font-size:16px;cursor:pointer;transition:.15s}
.opt:hover{background:#f3f8fa;border-color:#8fb7c1}.opt:disabled{cursor:default}.correct{background:#e2f6e9!important;border-color:#2f9e5b!important}
.wrong{background:#fde8e8!important;border-color:#d94b4b!important}.feedback{margin-top:16px;padding:15px;border-radius:12px;background:#f4f8fa;display:none;line-height:1.45}
.next{margin-top:16px;padding:12px 18px;border:0;border-radius:12px;background:#0f4c5c;color:white;font-size:16px;font-weight:700;cursor:pointer;display:none}
.result{text-align:center;padding:12px}.big{font-size:48px;font-weight:800;color:#0f4c5c}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.action{padding:12px 16px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:700}.primary{background:#0f4c5c;color:white}.secondary{background:#e7eff2;color:#17313b}
footer{text-align:center;color:#78909a;font-size:13px;padding:24px}
</style></head><body>
<header><div class="header-inner"><div class="brand">IER</div><a class="back" href="index.html">← Voltar aos jogos</a></div></header>
<div class="wrap"><div class="subtitle">Jogo de Fixação • Exames Contrastados • 60 questões</div>
<div class="card" id="game"><div class="meta"><span id="count"></span><span id="score">Acertos: 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="options"></div>
<div class="feedback" id="feedback"></div><button class="next" id="next">Próxima questão</button></div></div>
<footer>IER • Aprender praticando</footer>
<script>
const questions = [{"q": "Os exames radiológicos contrastados permitem principalmente:", "options": ["Avaliar apenas estruturas ósseas", "Visualizar estruturas e partes anatômicas com maior clareza de detalhes", "Substituir todos os exames radiológicos convencionais", "Eliminar a necessidade de avaliação diagnóstica"], "answer": 1, "explanation": "Segundo a apostila, o contraste auxilia a visualização de estruturas anatômicas que podem não ser vistas claramente em exames radiológicos convencionais."}, {"q": "O sulfato de bário é empregado principalmente no estudo do:", "options": ["Sistema nervoso central", "Sistema cardiovascular", "Sistema gastrointestinal", "Sistema urinário"], "answer": 2, "explanation": "A apostila associa o sulfato de bário ao estudo radiológico do sistema gastrointestinal."}, {"q": "Na apostila, o gadolínio aparece associado principalmente à:", "options": ["Radiologia odontológica", "Medicina nuclear", "Mamografia", "Ressonância magnética"], "answer": 3, "explanation": "O material cita o gadolínio para sistema vascular e outros estudos em ressonância magnética."}, {"q": "O tecnécio-99 é citado como contraste/radiofármaco utilizado em:", "options": ["Medicina nuclear", "Radiologia convencional do cólon", "Urografia excretora", "Histerossalpingografia"], "answer": 0, "explanation": "A apostila associa o tecnécio-99 aos sistemas circulatório/endócrino e outros estudos em medicina nuclear."}, {"q": "Qual condição aparece como contraindicação ao uso de iodo iônico?", "options": ["Miopia", "Fratura de rádio", "Doença renal ou hepática grave", "Cárie dentária"], "answer": 2, "explanation": "A apostila lista doença renal ou hepática grave entre as contraindicações ao iodo iônico."}, {"q": "Sobre o sulfato de bário, a apostila afirma que ele:", "options": ["É administrado rotineiramente por via intravenosa", "É o contraste padrão da ressonância magnética", "É usado apenas no sistema urinário", "Não deve ser injetado na corrente sanguínea"], "answer": 3, "explanation": "Segundo o material, o BaSO4 não deve ser injetado na corrente sanguínea, pois não é diluído pelo plasma."}, {"q": "Qual exemplo de contraste iodado não iônico aparece na apostila?", "options": ["Iohexol", "Sulfato de bário", "Tecnécio-99", "Carbonato de cálcio"], "answer": 0, "explanation": "Entre os exemplos de não iônicos, a apostila cita iodixanol, iohexol e iobitridol."}, {"q": "Contrastes positivos ou radiopacos são aqueles que:", "options": ["Permitem passagem dos raios X mais facilmente", "Absorvem mais radiação que as estruturas vizinhas", "São obrigatoriamente gases", "Só podem ser administrados por via oral"], "answer": 1, "explanation": "A apostila define os positivos/radiopacos como meios que absorvem mais radiação do que as estruturas vizinhas."}, {"q": "Um meio de contraste hidrossolúvel é aquele que:", "options": ["Dissolve-se somente em gordura", "Não se dissolve", "É necessariamente gasoso", "Dissolve-se em água"], "answer": 3, "explanation": "A apostila define hidrossolúvel como o meio que se dissolve em água."}, {"q": "A via em que o contraste é ingerido pela boca é denominada:", "options": ["Oral", "Parenteral", "Intracavitária", "Endocavitária"], "answer": 0, "explanation": "A via oral corresponde à ingestão do meio de contraste pela boca."}, {"q": "Na classificação da apostila, a administração endovenosa ou arterial é via:", "options": ["Oral", "Parenteral", "Endocavitária", "Intracavitária"], "answer": 1, "explanation": "O material define como parenteral a administração do contraste por vias endovenosas ou arteriais."}, {"q": "A administração por orifícios naturais que se comunicam com o meio externo é classificada como:", "options": ["Oral exclusivamente", "Parenteral", "Endocavitária", "Intravenosa"], "answer": 2, "explanation": "Segundo a apostila, a via endocavitária utiliza orifícios naturais que se comunicam com o meio externo."}, {"q": "Qual manifestação é classificada como reação adversa leve?", "options": ["Eritema", "Cianose", "Perda de consciência", "Dispneia grave"], "answer": 0, "explanation": "A apostila inclui sensação de calor e dor, eritema, náuseas e vômitos entre as reações leves."}, {"q": "Qual manifestação é classificada como reação moderada?", "options": ["Hipotensão grave", "Urticária com ou sem prurido", "Perda de consciência", "Cianose"], "answer": 1, "explanation": "Urticária com ou sem prurido, tosse irritativa, espirros, dispneia leve, sudorese e cefaleia aparecem como reações moderadas."}, {"q": "Qual manifestação aparece entre as reações graves ou agudas?", "options": ["Náusea isolada", "Eritema", "Hipotensão", "Sensação de calor"], "answer": 2, "explanation": "A apostila inclui hipotensão, cianose, dispneia grave, taquicardia e perda de consciência entre as reações graves/agudas."}, {"q": "Em reação grave ou aguda durante o exame, a apostila destaca que:", "options": ["O paciente deve ser liberado imediatamente", "Nenhuma intervenção é necessária", "Somente água deve ser oferecida", "A equipe deve intervir para evitar agravamento"], "answer": 3, "explanation": "O material ressalta a necessidade de intervenção da equipe em reações graves ou agudas."}, {"q": "A urografia excretora estuda radiologicamente o:", "options": ["Sistema urinário", "Sistema respiratório", "Intestino grosso", "Sistema nervoso"], "answer": 0, "explanation": "A apostila define a urografia excretora como estudo radiológico contrastado do sistema urinário."}, {"q": "Outro nome apresentado para urografia excretora é:", "options": ["Clister opaco", "Pielografia venosa", "SEED", "Defecograma"], "answer": 1, "explanation": "O material também denomina o exame urografia intravenosa, pielografia venosa ou pielografia excretora."}, {"q": "Qual é uma indicação clínica de urografia excretora listada na apostila?", "options": ["Bronquite", "Gastrite", "Hematúria", "Sinusite"], "answer": 2, "explanation": "Hematúria aparece entre as indicações, junto a algias urinárias, ITU, nefrocalcinose, obstrução ureteral, anormalidades congênitas e litíase."}, {"q": "Antes da urografia excretora, a apostila indica que o paciente:", "options": ["Faça exercício intenso", "Ingira bário grosso", "Fume para estimular secreções", "Urine antes do exame"], "answer": 3, "explanation": "O material recomenda que o paciente urine antes da realização do exame."}, {"q": "A primeira radiografia da urografia excretora é:", "options": ["Radiografia piloto em simples de abdome", "Perfil de tórax", "OAD do esôfago", "PA do crânio"], "answer": 0, "explanation": "A radiografia piloto em simples de abdome verifica posicionamento, fatores técnicos e preparo."}, {"q": "Na urografia excretora descrita, a radiografia de 5 minutos corresponde a:", "options": ["Pós-miccional", "Nefrograma", "Perfil da bexiga", "Clister"], "answer": 1, "explanation": "A apostila descreve aos 5 minutos um nefrograma, um spot dos rins."}, {"q": "A radiografia de 10 minutos da urografia excretora é descrita como:", "options": ["Nefrograma inicial", "Pós-miccional", "Pielocalicial", "Defecograma"], "answer": 2, "explanation": "A terceira radiografia, aos 10 minutos, é descrita como pielocalicial, com spot dos rins."}, {"q": "Na urografia excretora, a radiografia pós-miccional é feita com:", "options": ["Bexiga completamente cheia", "Contraste no esôfago", "Cólon em duplo contraste", "Bexiga vazia"], "answer": 3, "explanation": "A sétima radiografia descrita é realizada com a bexiga vazia, após micção."}, {"q": "A principal diferença da urografia minutada é que as imagens são obtidas:", "options": ["Minuto a minuto após a injeção", "Somente após 24 horas", "Apenas antes do contraste", "Somente durante a micção"], "answer": 0, "explanation": "Na urografia minutada, a aquisição começa logo após a injeção e ocorre minuto a minuto."}, {"q": "Na urografia minutada descrita na apostila:", "options": ["Utiliza-se obrigatoriamente duplo contraste", "Não se utiliza faixa compressora", "O contraste é sulfato de bário", "O estudo é exclusivo do cólon"], "answer": 1, "explanation": "O material informa que não deve ser usada faixa compressora na urografia minutada."}, {"q": "A urografia retrógrada descrita estuda principalmente:", "options": ["Estômago e duodeno", "Tubas uterinas", "Bexiga e uretra", "Cólon transverso"], "answer": 2, "explanation": "A apostila descreve a urografia retrógrada, normalmente realizada em homens, para estudo da bexiga e uretra."}, {"q": "Durante a urografia retrógrada, as radiografias são realizadas em:", "options": ["AP e perfil de crânio", "PA e lateral de tórax", "Somente AP", "OPD e OPE"], "answer": 3, "explanation": "O material orienta radiografias em OPD e OPE durante a injeção para acompanhar o trânsito do contraste."}, {"q": "A histerossalpingografia estuda particularmente:", "options": ["Tubas uterinas", "Ureteres", "Jejuno", "Cólon ascendente"], "answer": 0, "explanation": "A apostila define a histerossalpingografia como estudo contrastado do sistema reprodutor feminino, em particular das tubas uterinas."}, {"q": "Qual é uma indicação clínica da histerossalpingografia citada?", "options": ["Litíase renal", "Oclusão das tubas uterinas", "Broncoaspiração", "Colite"], "answer": 1, "explanation": "Oclusão/obstrução tubária, estreitamento e neoplasias aparecem como indicações."}, {"q": "Segundo a apostila, a histerossalpingografia deve ser realizada entre:", "options": ["1º e 3º dia", "20º e 28º dia", "7º e 13º dia do ciclo menstrual", "Somente durante a menstruação"], "answer": 2, "explanation": "O preparo indicado no material é realizar o exame entre o 7º e o 13º dia do ciclo menstrual."}, {"q": "Qual situação é contraindicação para histerossalpingografia segundo a apostila?", "options": ["Jejum de oito horas", "Uso de absorvente externo", "Posição de litotomia", "Menstruação atuante"], "answer": 3, "explanation": "Apostila lista menstruação atuante, leucorreia, alergia ao contraste, falta de higiene íntima e falta de abstinência sexual entre contraindicações."}, {"q": "A posição utilizada para iniciar a histerossalpingografia é:", "options": ["Litotomia", "Sims", "Trendelenburg exclusivamente", "Decúbito ventral"], "answer": 0, "explanation": "O material orienta posição de litotomia/ginecológica, em decúbito dorsal, com flexão dos quadris e joelhos."}, {"q": "Na histerossalpingografia, a radiografia piloto descrita é uma:", "options": ["PA de tórax", "Panorâmica da bacia", "Perfil de crânio", "AP do joelho"], "answer": 1, "explanation": "A apostila descreve uma radiografia panorâmica da bacia como piloto."}, {"q": "Na Prova de Cote, segundo a apostila, são injetados:", "options": ["20 ml de bário no reto", "350 ml de bário no estômago", "5 ml de ar na cavidade uterina", "300 ml de bário no jejuno"], "answer": 2, "explanation": "A Prova de Cote é descrita com injeção de 5 ml de ar na cavidade uterina para verificar o retorno do contraste."}, {"q": "Após a histerossalpingografia, recomenda-se permanecer no setor por mais:", "options": ["2 minutos", "5 minutos", "60 minutos", "15 minutos"], "answer": 3, "explanation": "A apostila recomenda permanência de mais 15 minutos no setor para observar possíveis reações alérgicas tardias."}, {"q": "A esofagografia baritada avalia:", "options": ["Forma e função da faringe e do esôfago", "Somente os rins", "Somente o reto", "Tubas uterinas"], "answer": 0, "explanation": "O material define a esofagografia baritada como avaliação da forma e função da faringe e do esôfago por meio de bário deglutido."}, {"q": "O jejum recomendado para esofagografia na apostila é de:", "options": ["2 a 4 horas", "8 a 10 horas", "12 a 16 horas obrigatoriamente", "24 horas"], "answer": 1, "explanation": "A apostila orienta jejum absoluto de 8 a 10 horas antes do exame."}, {"q": "Durante o jejum para esofagografia, o paciente é orientado a não fumar nem mascar chicletes porque isso:", "options": ["Reduz a frequência cardíaca", "Impede filtração renal", "Aumenta salivação e secreção gástrica", "Provoca opacificação do cólon"], "answer": 2, "explanation": "O material explica que fumar e mascar chiclete aumentam a salivação e a secreção gástrica."}, {"q": "Na esofagografia, o paciente ingere cerca de 150 ml de bário grosso divididos em:", "options": ["5 fases de 30 ml", "2 fases de 75 ml", "10 fases de 15 ml", "3 fases de 50 ml"], "answer": 3, "explanation": "A apostila orienta aproximadamente 150 ml de bário grosso em três fases de 50 ml."}, {"q": "Na primeira fase da deglutição da esofagografia é realizada projeção:", "options": ["AP do esôfago", "Perfil do reto", "OPE do cólon", "AP da bexiga"], "answer": 0, "explanation": "Na primeira fase, o material orienta AP do esôfago."}, {"q": "Na segunda fase da esofagografia, a projeção indicada é:", "options": ["PA do abdome", "Oblíqua, OAD ou OPD", "AP axial da sínfise", "Perfil do reto"], "answer": 1, "explanation": "A segunda fase é realizada em projeção oblíqua do esôfago, OAD ou OPD."}, {"q": "Na terceira fase da esofagografia, realiza-se:", "options": ["AP axial", "PA de abdome", "Perfil direito ou esquerdo", "Somente OAD"], "answer": 2, "explanation": "A terceira fase é descrita em perfil, direito ou esquerdo."}, {"q": "Na seriografia do estômago e duodeno, o bário ralo citado é de aproximadamente:", "options": ["50 ml", "100 ml", "150 ml", "350 ml"], "answer": 3, "explanation": "A apostila cita cerca de 350 ml de contraste de bário ralo."}, {"q": "No duplo contraste do estômago, o contraste negativo efervescente forma:", "options": ["Uma grande bolha de gás", "Um cálculo renal", "Uma camada de tecido adiposo", "Uma solução intravenosa"], "answer": 0, "explanation": "Segundo a apostila, os cristais efervescentes formam uma grande bolha de gás no estômago."}, {"q": "Após ingerir o contraste negativo efervescente, o paciente deve ser orientado a:", "options": ["Caminhar por 30 minutos", "Não arrotar", "Urinar imediatamente", "Inspirar contraste"], "answer": 1, "explanation": "O material orienta o paciente a não eliminar os gases pela via oral, isto é, não arrotar."}, {"q": "O trânsito intestinal tem como objetivo estudar:", "options": ["Esôfago, estômago e reto", "Cólon ascendente, transverso e descendente", "Duodeno, jejuno e íleo", "Bexiga, uretra e ureteres"], "answer": 2, "explanation": "A apostila descreve o estudo da forma e função dos três segmentos do intestino delgado: duodeno, jejuno e íleo."}, {"q": "No trânsito intestinal, a contagem do tempo começa:", "options": ["Antes do preparo intestinal", "Ao chegar ao serviço", "Após a radiografia de 24 h", "Após o último gole do contraste"], "answer": 3, "explanation": "O tempo deve começar a ser controlado após o paciente beber o último gole do bário ralo."}, {"q": "Qual indicação clínica aparece para trânsito intestinal?", "options": ["Síndrome da má-absorção", "Estenose uretral", "Hematúria", "Oclusão tubária"], "answer": 0, "explanation": "Apostila lista enterite, gastroenterite, síndrome da má-absorção e patologias do íleo."}, {"q": "No trânsito intestinal, o paciente deverá ingerir aproximadamente:", "options": ["20 ml de iodo", "300 ml de bário ralo ou fino", "5 ml de ar", "1 ml de atropina"], "answer": 1, "explanation": "O procedimento descrito utiliza cerca de 300 ml de bário ralo ou fino."}, {"q": "A radiografia de 15 minutos do trânsito intestinal é realizada em:", "options": ["Perfil do reto", "OAD", "AP do abdome", "OPE"], "answer": 2, "explanation": "A sequência da apostila indica AP do abdome aos 15 e 30 minutos."}, {"q": "A radiografia tardia de 24 horas no trânsito intestinal pode ser realizada:", "options": ["Em todos os pacientes obrigatoriamente", "Somente antes do contraste", "Nunca", "A critério médico"], "answer": 3, "explanation": "A apostila informa que, a critério médico, pode ser realizada uma AP de abdome tardia em 24 horas."}, {"q": "O clister opaco ou enema baritado estuda:", "options": ["Intestino grosso", "Sistema urinário", "Esôfago", "Tubas uterinas"], "answer": 0, "explanation": "O objetivo descrito é estudar radiologicamente a forma e função do intestino grosso e detectar condições anormais."}, {"q": "Qual condição é uma indicação clínica do clister opaco segundo a apostila?", "options": ["Hematúria", "Diverticulite", "Estenose uretral", "Nefrocalcinose"], "answer": 1, "explanation": "Colite, diverticulite, vólvulo, intussuscepção, apendicite não emergencial e neoplasia são listadas como indicações."}, {"q": "No clister opaco, o meio de contraste positivo utilizado é:", "options": ["Gadolínio", "Tecnécio-99", "Sulfato de bário", "Ar exclusivamente"], "answer": 2, "explanation": "A apostila indica BaSO4 como contraste positivo e, em seguida, ar como contraste negativo."}, {"q": "A posição de Sims é utilizada no clister opaco para:", "options": ["Estudo da uretra", "Histerossalpingografia", "Punção venosa", "Aplicação retal"], "answer": 3, "explanation": "O preparo para aplicação retal é realizado com o paciente em posição de Sims."}, {"q": "No preparo do contraste para clister, a água deve estar aproximadamente entre:", "options": ["30 °C e 32 °C", "5 °C e 10 °C", "50 °C e 60 °C", "70 °C e 80 °C"], "answer": 0, "explanation": "A apostila orienta água em temperatura ambiente entre 30 °C e 32 °C e alerta para não utilizar água quente."}, {"q": "Na sequência do clister opaco, a projeção OAD é indicada para visualizar:", "options": ["Flexura hepática", "Flexura esplênica", "Bexiga", "Duodeno"], "answer": 1, "explanation": "No resumo da apostila, OAD é indicada para a flexura esplênica."}, {"q": "No clister opaco, a projeção OAE é indicada para visualizar:", "options": ["Reto em perfil", "Cólon sigmoide de frente", "Flexura hepática", "Uretra"], "answer": 2, "explanation": "O resumo das radiografias associa OAE à visualização da flexura hepática."}, {"q": "A AP axial da sínfise púbica, Método de Chassard-Lapine, é utilizada para visualizar:", "options": ["Flexura esplênica", "Estômago", "Tubas uterinas", "Cólon sigmoide de frente"], "answer": 3, "explanation": "A apostila descreve a AP axial da sínfise púbica para visualização frontal do cólon sigmoide."}];
let current=0,score=0;
function render(){const item=questions[current];document.getElementById('count').textContent=`Questão ${current+1} de ${questions.length}`;document.getElementById('score').textContent=`Acertos: ${score}`;document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;document.getElementById('question').textContent=item.q;const box=document.getElementById('options');box.innerHTML='';const fb=document.getElementById('feedback');fb.style.display='none';fb.textContent='';document.getElementById('next').style.display='none';item.options.forEach((txt,idx)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+idx)+') '+txt;b.onclick=()=>answer(idx,b);box.appendChild(b);});}
function answer(idx,btn){const item=questions[current];[...document.querySelectorAll('.opt')].forEach((b,i)=>{b.disabled=true;if(i===item.answer)b.classList.add('correct');});if(idx===item.answer)score++;else btn.classList.add('wrong');document.getElementById('score').textContent=`Acertos: ${score}`;const fb=document.getElementById('feedback');fb.textContent=(idx===item.answer?'Muito bem! ':'Revise este ponto. ')+item.explanation;fb.style.display='block';document.getElementById('next').style.display='inline-block';}
document.getElementById('next').onclick=()=>{current++;if(current<questions.length)render();else finish();};
function finish(){document.getElementById('bar').style.width='100%';const pct=Math.round(score/questions.length*100);let msg=pct>=80?'Excelente desempenho!':pct>=60?'Bom trabalho! Continue praticando.':'Vale revisar o conteúdo e tentar novamente.';document.getElementById('game').innerHTML=`<div class="result"><div class="big">${score}/${questions.length}</div><h2>Resultado final</h2><p>Você acertou <strong>${pct}%</strong> das questões.</p><p>${msg}</p><div class="actions"><button class="action primary" onclick="location.reload()">Jogar novamente</button><a class="action secondary" href="index.html">Outros jogos</a></div></div>`;}
render();
</script></body></html>
