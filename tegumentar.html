<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IER - Tegumentar</title>
<meta name="description" content="Jogo de fixação IER - Tegumentar">
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef3f6;color:#17313b}
header{background:#0f4c5c;color:white;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header-inner{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:30px;letter-spacing:.5px}
.back{color:white;text-decoration:none;font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:18px}
.subtitle{color:#56717a;margin:4px 0 18px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(15,76,92,.12)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#526b73}
.progress{height:11px;background:#dfe8eb;border-radius:999px;overflow:hidden;margin:18px 0 22px}
.bar{height:100%;background:#0f4c5c;width:0%;transition:width .25s}
h2{font-size:22px;line-height:1.35;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;margin:10px 0;border:1px solid #cfdde2;border-radius:12px;background:white;color:#17313b;font-size:16px;cursor:pointer;transition:.15s}
.opt:hover{background:#f3f8fa;border-color:#8fb7c1}
.opt:disabled{cursor:default}
.correct{background:#e2f6e9!important;border-color:#2f9e5b!important}
.wrong{background:#fde8e8!important;border-color:#d94b4b!important}
.feedback{margin-top:16px;padding:15px;border-radius:12px;background:#f4f8fa;display:none;line-height:1.45}
.next{margin-top:16px;padding:12px 18px;border:0;border-radius:12px;background:#0f4c5c;color:white;font-size:16px;font-weight:700;cursor:pointer;display:none}
.result{text-align:center;padding:12px}
.big{font-size:48px;font-weight:800;color:#0f4c5c}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.action{padding:12px 16px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:700}
.primary{background:#0f4c5c;color:white}
.secondary{background:#e7eff2;color:#17313b}
footer{text-align:center;color:#78909a;font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">IER</div>
    <a class="back" href="index.html">← Voltar aos jogos</a>
  </div>
</header>
<div class="wrap">
  <div class="subtitle">Jogo de Fixação • Tegumentar • 25 questões</div>
  <div class="card" id="game">
    <div class="meta"><span id="count"></span><span id="score">Acertos: 0</span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Próxima questão</button>
  </div>
</div>
<footer>IER • Aprender praticando</footer>
<script>
const questions = [{"q": "Qual é uma das principais funções da pele?", "options": ["Produzir hemácias", "Proteger o corpo contra o meio ambiente", "Filtrar o sangue", "Produzir bile"], "answer": 1, "explanation": "A apostila destaca a proteção contra influências ambientais danosas."}, {"q": "A regulação do calor pela pele ocorre principalmente por meio de:", "options": ["Glândulas sudoríparas e vasos sanguíneos", "Unhas e pelos", "Glândulas salivares", "Cartilagens"], "answer": 0, "explanation": "Sudorese e alterações do fluxo sanguíneo cutâneo participam da termorregulação."}, {"q": "A sensibilidade da pele depende de:", "options": ["Nervos superficiais e terminações sensitivas", "Alvéolos", "Néfrons", "Tendões"], "answer": 0, "explanation": "A pele possui terminações sensitivas que percebem diferentes estímulos."}, {"q": "Qual camada da pele não é vascularizada?", "options": ["Derme", "Hipoderme", "Epiderme", "Tecido adiposo"], "answer": 2, "explanation": "A epiderme é descrita na apostila como não vascularizada."}, {"q": "Qual pigmento protege o DNA contra a ação nociva da radiação solar?", "options": ["Queratina", "Melanina", "Hemoglobina", "Colágeno"], "answer": 1, "explanation": "A melanina atua na pigmentação e na proteção contra a radiação solar."}, {"q": "A queratina ajuda principalmente a:", "options": ["Aumentar a perda de água", "Evitar perdas de água e proteger contra agressões externas", "Produzir suor", "Filtrar o sangue"], "answer": 1, "explanation": "A queratina forma uma camada protetora nas células da epiderme."}, {"q": "Para que a vitamina D seja sintetizada, a apostila destaca a necessidade de:", "options": ["Exposição à luz solar", "Ingestão de água", "Contração muscular", "Sono profundo"], "answer": 0, "explanation": "A exposição à luz solar participa da síntese de vitamina D."}, {"q": "A derme é formada principalmente por:", "options": ["Tecido conjuntivo", "Tecido ósseo", "Tecido cartilaginoso", "Tecido nervoso exclusivamente"], "answer": 0, "explanation": "A derme é uma camada de tecido conjuntivo localizada abaixo da epiderme."}, {"q": "Uma função importante da derme é:", "options": ["Garantir elasticidade e resistência da pele", "Produzir urina", "Armazenar bile", "Realizar hematose"], "answer": 0, "explanation": "A derme contribui para a elasticidade e resistência da pele."}, {"q": "A nutrição e oxigenação da epiderme dependem da vascularização da:", "options": ["Unha", "Derme", "Haste do pelo", "Camada córnea"], "answer": 1, "explanation": "A derme é ricamente vascularizada e nutre a epiderme."}, {"q": "A hipoderme é composta principalmente por:", "options": ["Tecido conjuntivo frouxo e tecido adiposo", "Tecido ósseo compacto", "Epitélio respiratório", "Cartilagem hialina"], "answer": 0, "explanation": "A apostila descreve tecido conjuntivo frouxo e adiposo na hipoderme."}, {"q": "Uma função da hipoderme é:", "options": ["Fixar a pele às estruturas subjacentes", "Produzir hemoglobina", "Secretar bile", "Formar alvéolos"], "answer": 0, "explanation": "A hipoderme auxilia na fixação da pele e no isolamento térmico."}, {"q": "Quais são anexos da pele?", "options": ["Unhas, pelos e glândulas sudoríparas e sebáceas", "Coração e vasos", "Rins e ureteres", "Traqueia e brônquios"], "answer": 0, "explanation": "Essas estruturas são apresentadas como anexos cutâneos."}, {"q": "As unhas estão aplicadas sobre a superfície dorsal das:", "options": ["Falanges distais", "Vértebras", "Costelas", "Escápulas"], "answer": 0, "explanation": "A apostila localiza as unhas sobre as falanges distais."}, {"q": "Nos pés, as unhas auxiliam principalmente no:", "options": ["Equilíbrio ao caminhar", "Bombeamento sanguíneo", "Olfato", "Controle hormonal"], "answer": 0, "explanation": "O material cita contribuição para o equilíbrio ao caminhar."}, {"q": "Um pelo é constituído basicamente por:", "options": ["Raiz e haste", "Córtex e medula óssea", "Átrio e ventrículo", "Ureter e uretra"], "answer": 0, "explanation": "A raiz fica implantada na pele e a haste projeta-se da superfície."}, {"q": "Cada folículo piloso está ligado a:", "options": ["Um pequeno músculo eretor", "Um néfron", "Uma válvula cardíaca", "Um alvéolo"], "answer": 0, "explanation": "O músculo eretor permite a movimentação do pelo."}, {"q": "As glândulas sudoríparas produzem:", "options": ["Sebo", "Suor", "Melanina", "Linfa"], "answer": 1, "explanation": "As glândulas sudoríparas produzem e lançam suor na superfície da epiderme."}, {"q": "O suor ajuda a manter a temperatura corporal porque:", "options": ["Aumenta a produção de gordura", "Elimina calor", "Bloqueia os vasos", "Produz queratina"], "answer": 1, "explanation": "A evaporação do suor contribui para a eliminação de calor."}, {"q": "Em dias quentes, o hipotálamo aumenta a perda de calor por:", "options": ["Vasodilatação cutânea e sudorese", "Vasoconstrição e redução do suor", "Aumento da queratina", "Redução do fluxo cutâneo"], "answer": 0, "explanation": "O material descreve aumento do fluxo sanguíneo superficial e secreção de suor."}, {"q": "Em dias frios, ocorre na pele:", "options": ["Aumento intenso do suor", "Vasodilatação permanente", "Diminuição do suor e contração dos vasos", "Aumento da melanina"], "answer": 2, "explanation": "A vasoconstrição e a menor sudorese reduzem a perda de calor."}, {"q": "As glândulas sebáceas são ausentes principalmente:", "options": ["No couro cabeludo", "Na face", "Na palma das mãos e planta dos pés", "Na derme"], "answer": 2, "explanation": "A apostila destaca ausência nessas regiões."}, {"q": "O sebo tem como função:", "options": ["Lubrificar pele e pelos", "Produzir hemácias", "Transportar oxigênio", "Formar urina"], "answer": 0, "explanation": "O sebo evita ressecamento e auxilia na proteção da pele."}, {"q": "As terminações nervosas livres são especialmente sensíveis a:", "options": ["Dor", "Luz", "Som", "Glicose"], "answer": 0, "explanation": "São sensíveis a estímulos mecânicos, térmicos e especialmente dolorosos."}, {"q": "Segundo a tabela da apostila, os receptores de Vater-Pacini estão associados à:", "options": ["Pressão", "Audição", "Visão", "Olfação"], "answer": 0, "explanation": "A tabela relaciona Vater-Pacini à sensação de pressão."}];
let current=0, score=0;
function render(){
  const item=questions[current];
  document.getElementById('count').textContent=`Questão ${current+1} de ${questions.length}`;
  document.getElementById('score').textContent=`Acertos: ${score}`;
  document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options');
  box.innerHTML='';
  const fb=document.getElementById('feedback');
  fb.style.display='none';
  fb.textContent='';
  document.getElementById('next').style.display='none';
  item.options.forEach((txt,idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=String.fromCharCode(65+idx)+') '+txt;
    b.onclick=()=>answer(idx,b);
    box.appendChild(b);
  });
}
function answer(idx,btn){
  const item=questions[current];
  [...document.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(i===item.answer) b.classList.add('correct');
  });
  if(idx===item.answer) score++;
  else btn.classList.add('wrong');
  document.getElementById('score').textContent=`Acertos: ${score}`;
  const fb=document.getElementById('feedback');
  fb.textContent=(idx===item.answer?'Muito bem! ':'Revise este ponto. ')+item.explanation;
  fb.style.display='block';
  document.getElementById('next').style.display='inline-block';
}
document.getElementById('next').onclick=()=>{
  current++;
  if(current<questions.length) render();
  else finish();
};
function finish(){
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);
  let msg = pct>=80 ? 'Excelente desempenho!' : pct>=60 ? 'Bom trabalho! Continue praticando.' : 'Vale revisar o conteúdo e tentar novamente.';
  document.getElementById('game').innerHTML=`
    <div class="result">
      <div class="big">${score}/${questions.length}</div>
      <h2>Resultado final</h2>
      <p>Você acertou <strong>${pct}%</strong> das questões.</p>
      <p>${msg}</p>
      <div class="actions">
        <button class="action primary" onclick="location.reload()">Jogar novamente</button>
        <a class="action secondary" href="index.html">Outros jogos</a>
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
