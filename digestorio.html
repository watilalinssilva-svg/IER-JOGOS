<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IER - Digestório</title>
<meta name="description" content="Jogo de fixação IER - Digestório">
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef3f6;color:#17313b}
header{background:#0f4c5c;color:white;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header-inner{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:30px;letter-spacing:.5px}
.back{color:white;text-decoration:none;font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:18px}
.subtitle{color:#56717a;margin:4px 0 18px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(15,76,92,.12)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#526b73}
.progress{height:11px;background:#dfe8eb;border-radius:999px;overflow:hidden;margin:18px 0 22px}
.bar{height:100%;background:#0f4c5c;width:0%;transition:width .25s}
h2{font-size:22px;line-height:1.35;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;margin:10px 0;border:1px solid #cfdde2;border-radius:12px;background:white;color:#17313b;font-size:16px;cursor:pointer;transition:.15s}
.opt:hover{background:#f3f8fa;border-color:#8fb7c1}
.opt:disabled{cursor:default}
.correct{background:#e2f6e9!important;border-color:#2f9e5b!important}
.wrong{background:#fde8e8!important;border-color:#d94b4b!important}
.feedback{margin-top:16px;padding:15px;border-radius:12px;background:#f4f8fa;display:none;line-height:1.45}
.next{margin-top:16px;padding:12px 18px;border:0;border-radius:12px;background:#0f4c5c;color:white;font-size:16px;font-weight:700;cursor:pointer;display:none}
.result{text-align:center;padding:12px}
.big{font-size:48px;font-weight:800;color:#0f4c5c}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.action{padding:12px 16px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:700}
.primary{background:#0f4c5c;color:white}
.secondary{background:#e7eff2;color:#17313b}
footer{text-align:center;color:#78909a;font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">IER</div>
    <a class="back" href="index.html">← Voltar aos jogos</a>
  </div>
</header>
<div class="wrap">
  <div class="subtitle">Jogo de Fixação • Digestório • 25 questões</div>
  <div class="card" id="game">
    <div class="meta"><span id="count"></span><span id="score">Acertos: 0</span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Próxima questão</button>
  </div>
</div>
<footer>IER • Aprender praticando</footer>
<script>
const questions = [{"q": "O sistema digestório é responsável principalmente por:", "options": ["Digestão e absorção dos alimentos", "Produção de urina", "Hematose", "Condução nervosa"], "answer": 0, "explanation": "A apostila define digestão e absorção como funções centrais."}, {"q": "O sistema digestório é protegido na cavidade abdominal pelo:", "options": ["Peritônio", "Pericárdio", "Endocárdio", "Epicárdio"], "answer": 0, "explanation": "O material cita peritônio visceral e parietal."}, {"q": "Entre as lâminas do peritônio encontra-se:", "options": ["Líquido peritoneal", "Líquor", "Sebo", "Linfa exclusivamente"], "answer": 0, "explanation": "A apostila cita líquido peritoneal entre as porções do peritônio."}, {"q": "O tubo digestório inclui:", "options": ["Boca, faringe, esôfago, estômago, intestino delgado e grosso", "Rins, ureteres e bexiga", "Traqueia e brônquios", "Coração e vasos"], "answer": 0, "explanation": "Essas estruturas são listadas como tubo digestório."}, {"q": "Qual das seguintes é uma glândula/estrutura anexa do sistema digestório segundo a apostila?", "options": ["Fígado", "Ureter", "Traqueia", "Baço exclusivamente linfático"], "answer": 0, "explanation": "O fígado é listado entre as estruturas anexas."}, {"q": "A faringe participa também do sistema:", "options": ["Respiratório", "Urinário", "Reprodutor", "Tegumentar"], "answer": 0, "explanation": "A faringe é compartilhada pelos sistemas respiratório e digestório."}, {"q": "O esôfago é descrito como um:", "options": ["Tubo muscular", "Osso longo", "Vaso arterial", "Órgão linfático"], "answer": 0, "explanation": "O material descreve o esôfago como tubo muscular."}, {"q": "O comprimento médio do esôfago citado é de aproximadamente:", "options": ["5 cm", "10 cm", "25 cm", "1 metro"], "answer": 2, "explanation": "A apostila cita cerca de 25 cm."}, {"q": "O esôfago está situado:", "options": ["Posterior à traqueia", "Dentro do ventrículo esquerdo", "Dentro do rim", "Anterior ao nariz"], "answer": 0, "explanation": "A relação anatômica posterior à traqueia é destacada."}, {"q": "A função do estômago está relacionada principalmente à:", "options": ["Digestão", "Hematose", "Produção de urina", "Transmissão nervosa"], "answer": 0, "explanation": "O estômago integra o tubo digestório e participa da digestão."}, {"q": "O intestino delgado pertence ao:", "options": ["Tubo digestório", "Sistema respiratório", "Sistema urinário", "Sistema nervoso"], "answer": 0, "explanation": "É uma das porções do tubo digestório."}, {"q": "O intestino grosso pertence ao:", "options": ["Tubo digestório", "Sistema cardiovascular", "Sistema tegumentar", "Sistema nervoso"], "answer": 0, "explanation": "É uma das porções finais do tubo digestório."}, {"q": "Qual órgão anexo produz bile?", "options": ["Fígado", "Bexiga", "Pulmão", "Timo"], "answer": 0, "explanation": "O fígado é órgão anexo digestório relacionado à bile."}, {"q": "Qual estrutura armazena a bile?", "options": ["Vesícula biliar", "Bexiga urinária", "Átrio direito", "Hipófise"], "answer": 0, "explanation": "A vesícula é apresentada entre as estruturas anexas do sistema digestório."}, {"q": "O pâncreas é classificado na apostila como:", "options": ["Estrutura/glândula anexa do sistema digestório", "Câmara cardíaca", "Via aérea", "Órgão tegumentar"], "answer": 0, "explanation": "O pâncreas aparece entre as glândulas anexas."}, {"q": "A língua é apresentada como:", "options": ["Estrutura anexa do sistema digestório", "Vaso sanguíneo", "Órgão urinário", "Glândula endócrina exclusivamente"], "answer": 0, "explanation": "A língua é listada entre as estruturas anexas."}, {"q": "Os dentes participam principalmente da:", "options": ["Etapa mecânica da alimentação", "Filtração renal", "Hematose", "Circulação pulmonar"], "answer": 0, "explanation": "Os dentes integram as estruturas anexas relacionadas ao processamento do alimento."}, {"q": "As glândulas salivares estão relacionadas à:", "options": ["Produção de saliva", "Produção de urina", "Produção de suor", "Produção de linfa"], "answer": 0, "explanation": "São glândulas anexas do sistema digestório."}, {"q": "O peritônio possui porções:", "options": ["Visceral e parietal", "Aferente e eferente", "Direita e tricúspide", "Superior e pulmonar"], "answer": 0, "explanation": "A apostila cita peritônio visceral e parietal."}, {"q": "Ascite é citada no contexto do:", "options": ["Peritônio/cavidade abdominal", "Sistema nervoso", "Pele", "Ouvido"], "answer": 0, "explanation": "O termo aparece no conteúdo introdutório do sistema digestório."}, {"q": "Pneumoperitônio é citado no conteúdo relacionado ao:", "options": ["Peritônio", "Pericárdio", "Endocárdio", "Canal vertebral"], "answer": 0, "explanation": "A apostila o menciona junto ao peritônio."}, {"q": "A boca representa:", "options": ["O início do tubo digestório", "O final do sistema urinário", "Uma câmara cardíaca", "Um linfonodo"], "answer": 0, "explanation": "A boca é a primeira estrutura listada no tubo digestório."}, {"q": "Após a faringe, o alimento segue para o:", "options": ["Esôfago", "Brônquio", "Ureter", "Átrio"], "answer": 0, "explanation": "O esôfago conduz o alimento após a faringe."}, {"q": "Qual conjunto contém apenas estruturas do tubo digestório?", "options": ["Boca, esôfago e estômago", "Fígado, pâncreas e rim", "Traqueia, brônquio e pulmão", "Ureter, bexiga e uretra"], "answer": 0, "explanation": "Boca, esôfago e estômago integram o tubo digestório."}, {"q": "Qual conjunto contém estruturas anexas citadas na apostila?", "options": ["Fígado, vesícula e pâncreas", "Rim, ureter e bexiga", "Traqueia, brônquio e alvéolo", "Átrio, ventrículo e aorta"], "answer": 0, "explanation": "As três estruturas são listadas como anexas ao sistema digestório."}];
let current=0, score=0;
function render(){
  const item=questions[current];
  document.getElementById('count').textContent=`Questão ${current+1} de ${questions.length}`;
  document.getElementById('score').textContent=`Acertos: ${score}`;
  document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options');
  box.innerHTML='';
  const fb=document.getElementById('feedback');
  fb.style.display='none';
  fb.textContent='';
  document.getElementById('next').style.display='none';
  item.options.forEach((txt,idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=String.fromCharCode(65+idx)+') '+txt;
    b.onclick=()=>answer(idx,b);
    box.appendChild(b);
  });
}
function answer(idx,btn){
  const item=questions[current];
  [...document.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(i===item.answer) b.classList.add('correct');
  });
  if(idx===item.answer) score++;
  else btn.classList.add('wrong');
  document.getElementById('score').textContent=`Acertos: ${score}`;
  const fb=document.getElementById('feedback');
  fb.textContent=(idx===item.answer?'Muito bem! ':'Revise este ponto. ')+item.explanation;
  fb.style.display='block';
  document.getElementById('next').style.display='inline-block';
}
document.getElementById('next').onclick=()=>{
  current++;
  if(current<questions.length) render();
  else finish();
};
function finish(){
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);
  let msg = pct>=80 ? 'Excelente desempenho!' : pct>=60 ? 'Bom trabalho! Continue praticando.' : 'Vale revisar o conteúdo e tentar novamente.';
  document.getElementById('game').innerHTML=`
    <div class="result">
      <div class="big">${score}/${questions.length}</div>
      <h2>Resultado final</h2>
      <p>Você acertou <strong>${pct}%</strong> das questões.</p>
      <p>${msg}</p>
      <div class="actions">
        <button class="action primary" onclick="location.reload()">Jogar novamente</button>
        <a class="action secondary" href="index.html">Outros jogos</a>
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
