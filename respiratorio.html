<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IER - Respiratório</title>
<meta name="description" content="Jogo de fixação IER - Respiratório">
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#eef3f6;color:#17313b}
header{background:#0f4c5c;color:white;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header-inner{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:30px;letter-spacing:.5px}
.back{color:white;text-decoration:none;font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:18px}
.subtitle{color:#56717a;margin:4px 0 18px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(15,76,92,.12)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#526b73}
.progress{height:11px;background:#dfe8eb;border-radius:999px;overflow:hidden;margin:18px 0 22px}
.bar{height:100%;background:#0f4c5c;width:0%;transition:width .25s}
h2{font-size:22px;line-height:1.35;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;padding:14px 15px;margin:10px 0;border:1px solid #cfdde2;border-radius:12px;background:white;color:#17313b;font-size:16px;cursor:pointer;transition:.15s}
.opt:hover{background:#f3f8fa;border-color:#8fb7c1}
.opt:disabled{cursor:default}
.correct{background:#e2f6e9!important;border-color:#2f9e5b!important}
.wrong{background:#fde8e8!important;border-color:#d94b4b!important}
.feedback{margin-top:16px;padding:15px;border-radius:12px;background:#f4f8fa;display:none;line-height:1.45}
.next{margin-top:16px;padding:12px 18px;border:0;border-radius:12px;background:#0f4c5c;color:white;font-size:16px;font-weight:700;cursor:pointer;display:none}
.result{text-align:center;padding:12px}
.big{font-size:48px;font-weight:800;color:#0f4c5c}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.action{padding:12px 16px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:700}
.primary{background:#0f4c5c;color:white}
.secondary{background:#e7eff2;color:#17313b}
footer{text-align:center;color:#78909a;font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">IER</div>
    <a class="back" href="index.html">← Voltar aos jogos</a>
  </div>
</header>
<div class="wrap">
  <div class="subtitle">Jogo de Fixação • Respiratório • 25 questões</div>
  <div class="card" id="game">
    <div class="meta"><span id="count"></span><span id="score">Acertos: 0</span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Próxima questão</button>
  </div>
</div>
<footer>IER • Aprender praticando</footer>
<script>
const questions = [{"q": "A principal função do sistema respiratório é:", "options": ["Introduzir oxigênio e liberar gás carbônico", "Produzir bile", "Filtrar urina", "Produzir linfa"], "answer": 0, "explanation": "A apostila relaciona o sistema respiratório à entrada de O2 e eliminação de CO2."}, {"q": "A troca gasosa entre o organismo e o meio é denominada:", "options": ["Hematose", "Diástole", "Peristaltismo", "Filtração glomerular"], "answer": 0, "explanation": "O material utiliza o termo hematose para a troca gasosa."}, {"q": "Além das trocas gasosas, o sistema respiratório participa da:", "options": ["Olfação", "Produção de urina", "Coagulação", "Formação das unhas"], "answer": 0, "explanation": "A apostila cita olfação entre as funções respiratórias."}, {"q": "As vias aéreas inferiores incluem:", "options": ["Traqueia, brônquios, bronquíolos e alvéolos", "Nariz e boca apenas", "Esôfago e estômago", "Ureteres e bexiga"], "answer": 0, "explanation": "Essas estruturas são listadas como vias aéreas inferiores."}, {"q": "A entrada do ar ocorre inicialmente pelo:", "options": ["Nariz", "Esôfago", "Ureter", "Intestino"], "answer": 0, "explanation": "O nariz é apresentado como responsável pela entrada do ar."}, {"q": "As grandes impurezas do ar podem ser retidas inicialmente pelos:", "options": ["Pelos das narinas", "Alvéolos", "Ventrículos", "Néfrons"], "answer": 0, "explanation": "Os pelos das narinas participam da filtragem inicial."}, {"q": "A cavidade nasal é dividida pelo:", "options": ["Septo nasal", "Diafragma", "Pericárdio", "Piloro"], "answer": 0, "explanation": "O septo nasal divide a cavidade nasal."}, {"q": "Posteriormente, a cavidade nasal comunica-se com a faringe pelas:", "options": ["Coanas", "Valvas", "Vilosidades", "Papilas"], "answer": 0, "explanation": "As coanas fazem essa comunicação."}, {"q": "As conchas nasais são também chamadas de:", "options": ["Cornetos", "Alvéolos", "Néfrons", "Linfonodos"], "answer": 0, "explanation": "A apostila apresenta conchas nasais ou cornetos."}, {"q": "Os espaços entre as conchas nasais são chamados de:", "options": ["Meatos", "Seios cardíacos", "Ductos biliares", "Cálices"], "answer": 0, "explanation": "Os meatos ficam entre as conchas nasais."}, {"q": "A faringe participa dos sistemas:", "options": ["Respiratório e digestório", "Urinário e reprodutor", "Nervoso e tegumentar", "Linfático e ósseo"], "answer": 0, "explanation": "A faringe desempenha função nos sistemas respiratório e digestório."}, {"q": "A traqueia pertence às:", "options": ["Vias aéreas inferiores", "Vias urinárias", "Glândulas anexas", "Câmaras cardíacas"], "answer": 0, "explanation": "A traqueia é listada entre as vias aéreas inferiores."}, {"q": "Os brônquios conduzem o ar em direção aos:", "options": ["Pulmões", "Rins", "Átrios", "Intestinos"], "answer": 0, "explanation": "Os brônquios fazem parte da árvore respiratória pulmonar."}, {"q": "Os bronquíolos são ramificações menores relacionadas aos:", "options": ["Brônquios", "Ureteres", "Vasos linfáticos", "Ductos deferentes"], "answer": 0, "explanation": "Os bronquíolos integram as vias aéreas inferiores."}, {"q": "Os alvéolos estão diretamente relacionados à:", "options": ["Troca gasosa", "Produção de bile", "Coagulação", "Produção de espermatozoides"], "answer": 0, "explanation": "Os alvéolos são a região pulmonar associada à hematose."}, {"q": "Durante a inspiração, as costelas movem-se:", "options": ["Para cima e para frente", "Para baixo e para dentro", "Apenas para trás", "Não se movem"], "answer": 0, "explanation": "Esse movimento é descrito no material durante a inspiração."}, {"q": "Durante a inspiração, os pulmões:", "options": ["Expandem-se", "Contraem-se", "Colapsam obrigatoriamente", "Não alteram volume"], "answer": 0, "explanation": "A expansão pulmonar acompanha a inspiração."}, {"q": "Durante a expiração, as costelas movem-se:", "options": ["Para baixo e para dentro", "Para cima e para frente", "Somente lateralmente", "Não se movem"], "answer": 0, "explanation": "Esse movimento é descrito durante a expiração."}, {"q": "Durante a expiração, os pulmões:", "options": ["Contraem-se", "Expandem-se", "Enchem-se de líquido", "Aumentam sempre de volume"], "answer": 0, "explanation": "A apostila descreve contração/redução do volume pulmonar na expiração."}, {"q": "Qual estrutura separa as cavidades torácica e abdominal e participa da ventilação?", "options": ["Diafragma", "Baço", "Pâncreas", "Bexiga"], "answer": 0, "explanation": "O diafragma é estrutura essencial na mecânica respiratória."}, {"q": "O mediastino contém, entre outras estruturas:", "options": ["Traqueia, esôfago, coração e grandes vasos", "Somente pulmões", "Somente rins", "Somente intestinos"], "answer": 0, "explanation": "A apostila lista essas estruturas no mediastino."}, {"q": "O gás eliminado pelo sistema respiratório é principalmente:", "options": ["Gás carbônico", "Nitrogênio líquido", "Ozônio", "Hidrogênio"], "answer": 0, "explanation": "O CO2 é citado como produto a ser eliminado."}, {"q": "A hematose permite principalmente:", "options": ["Trocas de O2 e CO2", "Produção de hormônios", "Formação de urina", "Produção de sebo"], "answer": 0, "explanation": "Hematose corresponde às trocas gasosas."}, {"q": "A olfação depende de:", "options": ["Células receptoras", "Plaquetas", "Hemácias", "Néfrons"], "answer": 0, "explanation": "A apostila cita células receptoras relacionadas à olfação."}, {"q": "A sequência mais adequada das vias inferiores é:", "options": ["Traqueia → brônquios → bronquíolos → alvéolos", "Alvéolos → uretra → traqueia", "Esôfago → brônquios → rim", "Nariz → ureter → pulmão"], "answer": 0, "explanation": "Essa sequência acompanha a condução do ar até a região de trocas."}];
let current=0, score=0;
function render(){
  const item=questions[current];
  document.getElementById('count').textContent=`Questão ${current+1} de ${questions.length}`;
  document.getElementById('score').textContent=`Acertos: ${score}`;
  document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options');
  box.innerHTML='';
  const fb=document.getElementById('feedback');
  fb.style.display='none';
  fb.textContent='';
  document.getElementById('next').style.display='none';
  item.options.forEach((txt,idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=String.fromCharCode(65+idx)+') '+txt;
    b.onclick=()=>answer(idx,b);
    box.appendChild(b);
  });
}
function answer(idx,btn){
  const item=questions[current];
  [...document.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(i===item.answer) b.classList.add('correct');
  });
  if(idx===item.answer) score++;
  else btn.classList.add('wrong');
  document.getElementById('score').textContent=`Acertos: ${score}`;
  const fb=document.getElementById('feedback');
  fb.textContent=(idx===item.answer?'Muito bem! ':'Revise este ponto. ')+item.explanation;
  fb.style.display='block';
  document.getElementById('next').style.display='inline-block';
}
document.getElementById('next').onclick=()=>{
  current++;
  if(current<questions.length) render();
  else finish();
};
function finish(){
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(score/questions.length*100);
  let msg = pct>=80 ? 'Excelente desempenho!' : pct>=60 ? 'Bom trabalho! Continue praticando.' : 'Vale revisar o conteúdo e tentar novamente.';
  document.getElementById('game').innerHTML=`
    <div class="result">
      <div class="big">${score}/${questions.length}</div>
      <h2>Resultado final</h2>
      <p>Você acertou <strong>${pct}%</strong> das questões.</p>
      <p>${msg}</p>
      <div class="actions">
        <button class="action primary" onclick="location.reload()">Jogar novamente</button>
        <a class="action secondary" href="index.html">Outros jogos</a>
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
